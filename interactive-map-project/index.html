<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="An interactive map application with search, markers, and dark mode.">
    <title>Interactive Map</title>
<!-- ✅ Bootstrap Icons CDN -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css">

    <!-- ✅ Bootstrap CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    
    <!-- ✅ Custom Styles -->
    <link rel="stylesheet" href="/src/assets/styles.css">


    <!-- ✅ Ensure Fast Loading -->
    <script type="module" src="./src/main.ts" defer></script>
</head>
<body>

    <!-- ✅ Full-screen Map Container -->
    <div id="mapView" role="application" aria-label="Interactive Map"></div>

    <!-- ✅ UI Elements Inside the Map -->
    <div class="map-controls" role="toolbar">
        <label for="searchBox" class="visually-hidden">Search Location</label>
        <input type="text" id="searchBox" class="form-control" placeholder="Search location..." aria-label="Search location">
        
        <button id="resetBtn" class="btn btn-primary" aria-label="Reset Map"><i class="bi bi-arrow-counterclockwise"></i> </button>
        <button id="toggleLayerBtn" class="btn btn-secondary" aria-label="Toggle City Markers"><i class="bi bi-geo-alt"></i></button>
        <button id="darkModeBtn" class="btn btn-dark" aria-label="Toggle Dark Mode"><i class="bi bi-moon-stars"></i></button>
    </div>

</body>
</html>
